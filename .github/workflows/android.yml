# Debug APK on every push; signed release APK when keystore secrets exist.
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Job-level so step `if:` conditions can see it.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore (only when secrets exist)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Assemble release APK (signed when keystore present)
        if: env.HAS_KEYSTORE == 'true'
        run: cd android && ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chesslens-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chesslens-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
